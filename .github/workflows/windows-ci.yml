name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows source and packaged smoke tests
    runs-on: windows-2025
    timeout-minutes: 75

    env:
      CRANE_CI_VERSION: 0.1.3-ci.${{ github.run_number }}
      CRANE_PYTHON_EMBED_SHA256: 0d57bb6cb078b74d23dbfe91f77d6780d45bed328911609f1f7ee2ba1606bf44

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12.7

      - name: Install locked Python dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock.txt

      - name: Test SBOM generator
        run: python scripts/generate-sbom.py --self-test

      - name: Check Go formatting
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $files = @(git ls-files '*.go')
          if ($LASTEXITCODE -ne 0) { throw 'Could not enumerate Go files.' }
          $unformatted = @()
          $failed = @()
          foreach ($file in $files) {
            $output = @(gofmt -d $file 2>&1 | ForEach-Object { $_.ToString() })
            $rc = $LASTEXITCODE
            $text = ($output -join "`n")
            if ($rc -ne 0) {
              if ($text -match '(?m)^diff ') {
                Write-Host "===== gofmt diff: $file ====="
                $output | ForEach-Object { Write-Host $_ }
                $unformatted += $file
                continue
              }
              Write-Host "===== gofmt error: $file ====="
              $output | ForEach-Object { Write-Host $_ }
              $failed += $file
              continue
            }
            if ($text -match '(?m)^diff ') {
              Write-Host "===== gofmt diff: $file ====="
              $output | ForEach-Object { Write-Host $_ }
              $unformatted += $file
            }
          }
          if ($failed.Count -gt 0) {
            throw "gofmt failed for: $($failed -join ', ')"
          }
          if ($unformatted.Count -gt 0) {
            throw "Unformatted Go files: $($unformatted -join ', ')"
          }

      - name: Run Go vet
        run: go vet ./...

      - name: Run Go tests
        run: go test ./... -count=1

      - name: Compile Python runtime
        run: python -m compileall -q crane

      - name: Run Python tests
        run: python -m unittest discover -s crane -p "test_*.py" -v

      - name: Build standalone Windows release
        shell: pwsh
        run: |
          $outputRoot = Join-Path $env:RUNNER_TEMP 'crane-release'
          ./scripts/build-release.ps1 -Version $env:CRANE_CI_VERSION -OutputRoot $outputRoot -Commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Windows release build failed.' }

      - name: Install and smoke-test packaged release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $testRoot = Join-Path $env:RUNNER_TEMP 'crane-ci-install'
          $releaseRoot = Join-Path (Join-Path $env:RUNNER_TEMP 'crane-release') $env:CRANE_CI_VERSION
          $installRoot = Join-Path $testRoot 'Programs\CRANE'

          $sbomPath = Join-Path $releaseRoot 'sbom.cdx.json'
          $sbom = Get-Content -LiteralPath $sbomPath -Raw | ConvertFrom-Json
          if ($sbom.bomFormat -ne 'CycloneDX' -or $sbom.specVersion -ne '1.5' -or @($sbom.components).Count -eq 0) {
            throw 'Release SBOM is missing, malformed, or has no dependency components.'
          }
          $manifest = Get-Content -LiteralPath (Join-Path $releaseRoot 'release-manifest.json') -Raw | ConvertFrom-Json
          $sbomEntry = @($manifest.artifacts | Where-Object { $_.name -eq 'sbom.cdx.json' })
          if ($sbomEntry.Count -ne 1 -or $sbomEntry[0].sha256 -ne (Get-FileHash -LiteralPath $sbomPath -Algorithm SHA256).Hash.ToLowerInvariant()) {
            throw 'Release manifest does not authenticate the SBOM.'
          }
          $env:LOCALAPPDATA = Join-Path $testRoot 'AppData\Local'
          $env:CRANE_SKIP_PATH_UPDATE = '1'
          New-Item -ItemType Directory -Path $env:LOCALAPPDATA -Force | Out-Null

          & (Join-Path $releaseRoot 'install.ps1') -Action Install -ReleaseSource $releaseRoot -InstallRoot $installRoot
          $agent = Join-Path $installRoot 'bin\agent.cmd'
          if (-not (Test-Path -LiteralPath $agent)) { throw 'Installer did not create agent.cmd.' }

          $version = & $agent --version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch [regex]::Escape($env:CRANE_CI_VERSION)) {
            throw "Packaged agent version check failed: $version"
          }

          $doctor = & $agent doctor
          if ($LASTEXITCODE -ne 0) { throw "Packaged agent doctor failed: $doctor" }
          $doctorText = $doctor -join "`n"
          foreach ($expected in @('Python runtime available: yes', 'SQLite available: yes', 'MCP modules available: yes')) {
            if ($doctorText -notmatch [regex]::Escape($expected)) { throw "Doctor did not report: $expected" }
          }

          $runOutput = & $agent run 'GitHub Actions packaged Windows smoke test'
          if ($LASTEXITCODE -ne 0) { throw "Packaged task submission failed: $runOutput" }
          $runText = $runOutput -join "`n"
          if ($runText -notmatch 'task\s+(task-[^\s]+)\s+queued') { throw "No durable task ID returned: $runText" }
          $taskId = $Matches[1]

          $statusText = ''
          for ($attempt = 0; $attempt -lt 60; $attempt++) {
            $status = & $agent status $taskId 2>&1
            if ($LASTEXITCODE -eq 0) {
              $statusText = $status -join "`n"
              if ($statusText -match 'Status: succeeded') { break }
            }
            Start-Sleep -Milliseconds 500
          }
          if ($statusText -notmatch 'Status: succeeded') { throw "Packaged task did not succeed: $statusText" }

          $result = & $agent result $taskId
          if ($LASTEXITCODE -ne 0 -or ($result -join "`n") -notmatch 'execution_mode') {
            throw "Packaged task result was not retrievable: $result"
          }

          $dataRoot = Join-Path $env:LOCALAPPDATA 'CRANE'
          $sentinel = Join-Path $dataRoot 'data\ci-preserve-sentinel.txt'
          Set-Content -LiteralPath $sentinel -Value 'preserve-user-data'

          $uninstall = & $agent uninstall
          if ($LASTEXITCODE -ne 0) { throw "Packaged uninstall command failed: $uninstall" }
          for ($attempt = 0; $attempt -lt 80 -and (Test-Path -LiteralPath $installRoot); $attempt++) {
            Start-Sleep -Milliseconds 250
          }
          if (Test-Path -LiteralPath $installRoot) { throw 'Packaged uninstall did not remove installation files.' }
          if ((Get-Content -LiteralPath $sentinel -Raw).Trim() -ne 'preserve-user-data') {
            throw 'Uninstall did not preserve user data by default.'
          }

      - name: Download Python embeddable runtime for acceptance builds
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'python-3.12.7-embed-amd64.zip'
          if (-not (Test-Path -LiteralPath $zip)) {
            Invoke-WebRequest -Uri 'https://www.python.org/ftp/python/3.12.7/python-3.12.7-embed-amd64.zip' -OutFile $zip
          }
          $actualHash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:CRANE_PYTHON_EMBED_SHA256) {
            throw "Python embeddable runtime hash mismatch: $actualHash"
          }
          "CRANE_PYTHON_EMBED_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build versioned releases for acceptance harness
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $acceptanceRoot = Join-Path $env:RUNNER_TEMP 'crane-acceptance-releases'
          New-Item -ItemType Directory -Path $acceptanceRoot -Force | Out-Null
          foreach ($v in @('0.1.0', '0.1.1', '0.1.2')) {
            ./scripts/build-release.ps1 -Version $v -OutputRoot $acceptanceRoot -Commit $env:GITHUB_SHA -BuildDate '2026-01-01T00:00:00Z' -PythonVersion '3.12.7' -PythonEmbedZip $env:CRANE_PYTHON_EMBED_ZIP
          }
          "CRANE_ACCEPTANCE_RELEASE_ROOT=$acceptanceRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify same-host release reproducibility
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $reproRoot = Join-Path $env:RUNNER_TEMP 'crane-reproducibility'
          New-Item -ItemType Directory -Path $reproRoot -Force | Out-Null
          $reproLog = Join-Path $reproRoot 'reproducibility.log'
          $goVersionLine = (& go version).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Could not determine Go version for reproducibility check.' }
          $goVersion = ($goVersionLine -split '\s+')[2]
          if ([string]::IsNullOrWhiteSpace($goVersion)) { throw "Could not parse Go version: $goVersionLine" }
          & ./scripts/test-release-reproducibility.ps1 -Version '0.1.2-repro' -Commit $env:GITHUB_SHA -BuildDate '2026-01-01T00:00:00Z' -PythonVersion '3.12.7' -GoVersion $goVersion -PythonEmbedZip $env:CRANE_PYTHON_EMBED_ZIP -OutputRoot $reproRoot 2>&1 | Tee-Object -FilePath $reproLog
          $reproExitCode = $LASTEXITCODE
          if ($reproExitCode -ne 0) { throw "Same-host reproducibility check failed with exit code $reproExitCode. See $reproLog" }

      - name: Run Windows acceptance harness
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/acceptance-windows.ps1 -ReleaseRoot $env:CRANE_ACCEPTANCE_RELEASE_ROOT

      - name: Upload Windows release and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crane-windows-ci-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/crane-release
            ${{ runner.temp }}/crane-acceptance-releases
            ${{ runner.temp }}/crane-reproducibility
          if-no-files-found: ignore
          retention-days: 7

  cross-env-repro:
    name: Cross-environment release reproducibility
    needs: windows
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      CRANE_REPRO_VERSION: 0.1.2
      CRANE_REPRO_BUILD_DATE: '2026-01-01T00:00:00Z'
      CRANE_PYTHON_EMBED_SHA256: 0d57bb6cb078b74d23dbfe91f77d6780d45bed328911609f1f7ee2ba1606bf44

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12.7

      - name: Download pinned Python embeddable runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'python-3.12.7-embed-amd64.zip'
          Invoke-WebRequest -Uri 'https://www.python.org/ftp/python/3.12.7/python-3.12.7-embed-amd64.zip' -OutFile $zip
          $actualHash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:CRANE_PYTHON_EMBED_SHA256) {
            throw "Python embeddable runtime hash mismatch: $actualHash"
          }
          "CRANE_PYTHON_EMBED_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build release on windows-2022
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $goVersion = ((go version).Trim() -split '\s+')[2]
          if ([string]::IsNullOrWhiteSpace($goVersion)) { throw 'Could not determine Go version.' }
          $root = Join-Path $env:RUNNER_TEMP 'crane-cross-env'
          ./scripts/build-release.ps1 -Version $env:CRANE_REPRO_VERSION -OutputRoot $root -Commit $env:GITHUB_SHA -BuildDate $env:CRANE_REPRO_BUILD_DATE -PythonVersion '3.12.7' -GoVersion $goVersion -PythonEmbedZip $env:CRANE_PYTHON_EMBED_ZIP
          if ($LASTEXITCODE -ne 0) { throw 'Cross-environment release build failed.' }

      - name: Download windows-2025 baseline release
        uses: actions/download-artifact@v4
        with:
          name: crane-windows-ci-${{ github.run_number }}
          path: ${{ runner.temp }}/crane-baseline

      - name: Compare release artifacts across environments
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $baseline = Join-Path $env:RUNNER_TEMP (Join-Path 'crane-baseline' (Join-Path 'crane-acceptance-releases' $env:CRANE_REPRO_VERSION))
          $candidate = Join-Path $env:RUNNER_TEMP (Join-Path 'crane-cross-env' $env:CRANE_REPRO_VERSION)
          if (-not (Test-Path -LiteralPath $baseline -PathType Container)) { throw "Baseline release not found: $baseline" }
          if (-not (Test-Path -LiteralPath $candidate -PathType Container)) { throw "Candidate release not found: $candidate" }
          $baselineFiles = @(Get-ChildItem -LiteralPath $baseline -File | Sort-Object Name)
          $candidateFiles = @(Get-ChildItem -LiteralPath $candidate -File | Sort-Object Name)
          $baselineNames = @($baselineFiles | ForEach-Object { $_.Name })
          $candidateNames = @($candidateFiles | ForEach-Object { $_.Name })
          if (($baselineNames -join '|') -ne ($candidateNames -join '|')) {
            throw "Release artifact lists differ: baseline=$($baselineNames -join ',') candidate=$($candidateNames -join ',')"
          }
          foreach ($file in $baselineFiles) {
            $other = Join-Path $candidate $file.Name
            $baselineHash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $candidateHash = (Get-FileHash -LiteralPath $other -Algorithm SHA256).Hash.ToLowerInvariant()
            $equal = $baselineHash -eq $candidateHash -and $file.Length -eq (Get-Item -LiteralPath $other).Length
            Write-Host ("CROSS-ENV {0} equal={1} sha256={2} size={3}" -f $file.Name, $equal, $baselineHash, $file.Length)
            if (-not $equal) { throw "Cross-environment reproducibility mismatch for $($file.Name)" }
          }
          Write-Host "CROSS-ENV RESULT=PASS ($($baselineFiles.Count) artifacts byte-for-byte identical between windows-2025 and windows-2022)"
